<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --black:   #080808;
  --bg:      #0d0c0a;
  --surface: #161512;
  --white:   #f0ede8;
  --off:     #c8c4bc;
  --mid:     #7a7670;
  --dim:     #3a3830;
  --rule:    #1e1c18;
  --rule2:   #2a2824;
  --gold:    #8a6a2a;
  --gold-lt: #b8922a;
  --green:   #4a7a5a;
  --violet:  #7a5a8a;
  --display: 'Cormorant Garamond', Georgia, serif;
  --body:    'EB Garamond', Georgia, serif;
}

html, body {
  background: var(--black);
  color: var(--white);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.8;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  background: var(--black);
  border-bottom: 1px solid var(--rule);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 64px;
  height: 80px;
}

.logo-img {
  height: auto;
  width: 140px;
  display: block;
  filter: invert(1) brightness(0.7);
}


.header-right {
  display: flex;
  align-items: center;
  gap: 40px;
}

.header-right a {
  font-family: var(--body);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.3);
  text-decoration: none;
  transition: color 0.25s;
  cursor: pointer;
}

.header-right a:hover { color: rgba(255,255,255,0.7); }
.header-right a.active { color: rgba(240,237,232,0.55); border-bottom: 1px solid var(--dim); padding-bottom: 2px; }

.page { padding-top: 72px; min-height: 100vh; }

/* ── LOADING STATE ── */
.loading-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: calc(100vh - 72px);
  font-family: var(--body);
  font-size: 11px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--dim);
}

/* ── ACCOUNT HEADER ── */
.acct-header {
  padding: 52px 64px 40px;
  border-bottom: 1px solid var(--rule);
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}

.acct-eyebrow {
  font-family: var(--body);
  font-size: 10px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--mid);
  margin-bottom: 12px;
}

.acct-name {
  font-family: var(--display);
  font-size: clamp(28px, 3vw, 42px);
  font-weight: 300;
  color: var(--white);
  letter-spacing: 0.02em;
  line-height: 1.1;
}

.acct-name em { font-style: italic; }

.acct-meta {
  font-family: var(--body);
  font-size: 13px;
  color: var(--mid);
  margin-top: 10px;
  letter-spacing: 0.08em;
}

.acct-status {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
}

.status-badge {
  font-family: var(--body);
  font-size: 9px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--gold-lt);
  border: 1px solid var(--gold);
  padding: 5px 14px;
}

.status-badge.phase2 { color: #9a7aaa; border-color: var(--violet); }
.status-badge.inactive { color: #aa7a3a; border-color: #6a4a1a; }

/* ── INACTIVE BANNER ── */
.inactive-banner {
  background: rgba(138,90,30,0.08);
  border-bottom: 1px solid #3a2810;
  padding: 20px 64px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.inactive-title {
  font-family: var(--display);
  font-size: 15px;
  letter-spacing: 0.1em;
  color: #c8922a;
  margin-bottom: 4px;
}
.inactive-sub {
  font-family: var(--body);
  font-size: 13px;
  color: var(--mid);
  font-style: italic;
}
.inactive-amount {
  text-align: right;
}
.inactive-amount-val {
  font-family: var(--display);
  font-size: 28px;
  color: #c8922a;
  letter-spacing: 0.02em;
}
.inactive-amount-label {
  font-family: var(--body);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--mid);
  margin-top: 2px;
}
.frozen-stat-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  border: 1px solid var(--rule2);
}

.last-updated {
  font-family: var(--body);
  font-size: 11px;
  color: var(--mid);
  letter-spacing: 0.1em;
  font-style: italic;
}

/* ── PHASE INDICATOR ── */
.phase-banner {
  padding: 16px 64px;
  border-bottom: 1px solid var(--rule);
  display: flex;
  gap: 0;
  overflow-x: auto;
}

.phase-tab {
  font-family: var(--body);
  font-size: 9px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--dim);
  padding: 8px 20px;
  border: 1px solid var(--rule2);
  margin-right: -1px;
}

.phase-tab.active {
  color: var(--gold-lt);
  border-color: var(--gold);
  background: rgba(138,106,42,0.06);
  z-index: 1;
}

.phase-tab.complete {
  color: #6aaa7a;
  border-color: #2a4a3a;
}

.phase-tab.phase2-active {
  color: #9a7aaa;
  border-color: var(--violet);
  background: rgba(122,90,138,0.06);
  z-index: 1;
}

/* ════════════════════════════════════════════════════════
   CLIENT VIEW — redesigned, mobile-first presentation layer
   (math untouched; this only restyles what clients see)
   ════════════════════════════════════════════════════════ */

/* Hero: the one number that matters */
.cv-hero {
  padding: 32px 20px 28px;
  border-bottom: 1px solid var(--rule);
}
.cv-hero-label {
  font-family: var(--body);
  font-size: 10px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--mid);
  margin-bottom: 10px;
}
.cv-hero-value {
  font-family: var(--display);
  font-weight: 300;
  font-size: clamp(44px, 13vw, 76px);
  line-height: 0.95;
  letter-spacing: 0.01em;
  color: var(--white);
}
.cv-hero-sub {
  font-family: var(--body);
  font-size: 14px;
  color: var(--mid);
  font-style: italic;
  margin-top: 12px;
}
.cv-hero-sub strong { color: var(--gold-lt); font-style: normal; font-weight: 400; }

/* Progress timeline — "how far along am I" */
.cv-timeline {
  padding: 22px 20px 24px;
  border-bottom: 1px solid var(--rule);
}
.cv-timeline-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 6px;
}
.cv-timeline-title {
  font-family: var(--body);
  font-size: 10px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--mid);
}
.cv-timeline-remain {
  font-family: var(--display);
  font-size: 17px;
  color: var(--gold-lt);
  letter-spacing: 0.02em;
}
.cv-track-wrap { position: relative; padding: 14px 0 8px; }
.cv-track {
  position: relative;
  height: 4px;
  border-radius: 2px;
  background: var(--rule2);
}
.cv-track-fill {
  position: absolute;
  top: 0; left: 0; height: 100%;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--gold) 0%, var(--gold-lt) 100%);
  width: 0;
  transition: width 1.1s cubic-bezier(.22,.61,.36,1);
}
.cv-track.phase2 .cv-track-fill {
  background: linear-gradient(90deg, #6a4a7a 0%, #9a7aaa 100%);
}
.cv-marker {
  position: absolute;
  top: 50%;
  width: 15px; height: 15px;
  border-radius: 50%;
  background: var(--white);
  border: 3px solid var(--bg);
  box-shadow: 0 0 0 1px var(--gold-lt);
  transform: translate(-50%, -50%);
  transition: left 1.1s cubic-bezier(.22,.61,.36,1);
  z-index: 2;
}
.cv-track.phase2 .cv-marker { box-shadow: 0 0 0 1px #9a7aaa; }
/* Flag sits BELOW the track so it never collides with the header's remain label.
   Clamped horizontally via max-width + clamp on the left inline style is handled in JS,
   but the base rule keeps it readable and edge-safe. */
.cv-marker-flag {
  position: absolute;
  top: 22px;
  transform: translateX(-50%);
  white-space: nowrap;
  font-family: var(--body);
  font-size: 9px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--white);
  transition: left 1.1s cubic-bezier(.22,.61,.36,1);
  z-index: 3;
  pointer-events: none;
}
.cv-endpoints {
  display: flex;
  justify-content: space-between;
  margin-top: 30px;
}

/* Mobile: stack the header so the remain label owns its own row (no collision) */
@media (max-width: 719px) {
  .cv-timeline-head { flex-direction: column; align-items: flex-start; gap: 6px; margin-bottom: 4px; }
  .cv-timeline-remain { font-size: 15px; }
}
.cv-endpoint-label {
  font-family: var(--body);
  font-size: 9px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--mid);
  margin-bottom: 4px;
}
.cv-endpoint-date {
  font-family: var(--display);
  font-size: 15px;
  color: var(--off);
  letter-spacing: 0.02em;
}
.cv-endpoint.right { text-align: right; }
.cv-endpoint.right .cv-endpoint-date { color: var(--gold-lt); }

/* Three headline cards */
.cv-cards {
  display: grid;
  grid-template-columns: 1fr;
  border-bottom: 1px solid var(--rule);
}
.cv-card {
  padding: 24px 20px;
  border-bottom: 1px solid var(--rule);
  text-align: center;
}
.cv-card:last-child { border-bottom: none; }
.cv-card-label {
  font-family: var(--body);
  font-size: 9px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--mid);
  margin-bottom: 10px;
}
.cv-card-value {
  font-family: var(--display);
  font-size: 30px;
  font-weight: 400;
  letter-spacing: 0.02em;
  color: var(--white);
  line-height: 1;
}
.cv-card-value.gold  { color: var(--gold-lt); }
.cv-card-value.green { color: #6aaa7a; }
.cv-card-sub {
  font-family: var(--body);
  font-size: 12px;
  color: var(--mid);
  font-style: italic;
  margin-top: 8px;
}

/* Single growth chart */
.cv-chart-section { padding: 32px 20px 36px; border-bottom: 1px solid var(--rule); }
.cv-chart-title {
  font-family: var(--body);
  font-size: 10px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--mid);
  margin-bottom: 6px;
}
.cv-chart-sub {
  font-family: var(--body);
  font-size: 13px;
  color: var(--dim);
  font-style: italic;
  margin-bottom: 24px;
}
.cv-chart-wrap { position: relative; height: 240px; }

/* Deposits vs earnings split */
.cv-split { padding: 30px 20px 36px; border-bottom: 1px solid var(--rule); }
.cv-split-title {
  font-family: var(--body);
  font-size: 10px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--mid);
  margin-bottom: 20px;
}
.cv-split-bar {
  display: flex;
  height: 44px;
  border-radius: 3px;
  overflow: hidden;
  background: var(--surface);
}
.cv-split-seg { height: 100%; transition: width 1s ease; min-width: 2px; }
.cv-split-seg.dep { background: linear-gradient(180deg, #9a7632, var(--gold)); }
.cv-split-seg.earn { background: linear-gradient(180deg, #5a8a6a, var(--green)); }
.cv-split-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  margin-top: 18px;
}
.cv-split-key { display: flex; align-items: flex-start; gap: 9px; }
.cv-split-dot {
  width: 10px; height: 10px; border-radius: 2px; margin-top: 5px; flex-shrink: 0;
}
.cv-split-dot.dep  { background: var(--gold); }
.cv-split-dot.earn { background: var(--green); }
.cv-split-ktext { line-height: 1.3; }
.cv-split-kname {
  font-family: var(--body);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--mid);
}
.cv-split-kval {
  font-family: var(--display);
  font-size: 19px;
  color: var(--white);
}
.cv-split-kval.earn { color: #6aaa7a; }

/* Collapsible transactions */
.cv-txn-section { padding: 20px 20px 40px; }
.cv-txn-toggle {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: none;
  border: 1px solid var(--rule2);
  border-radius: 3px;
  padding: 16px 20px;
  cursor: pointer;
  font-family: var(--body);
  font-size: 10px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--off);
  transition: border-color 0.2s, color 0.2s;
}
.cv-txn-toggle:hover { border-color: var(--gold); color: var(--white); }
.cv-txn-chevron { transition: transform 0.3s ease; font-size: 12px; color: var(--mid); }
.cv-txn-toggle.open .cv-txn-chevron { transform: rotate(180deg); }
.cv-txn-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease;
}
.cv-txn-body.open { max-height: 4000px; }
.cv-txn-inner { padding-top: 14px; }

/* Inactive / paused banner (kept, restyled to match) */
.cv-paused {
  padding: 22px 20px;
  background: rgba(138,90,30,0.08);
  border-bottom: 1px solid #3a2810;
}
.cv-paused-title {
  font-family: var(--display);
  font-size: 17px;
  color: #c8922a;
  letter-spacing: 0.06em;
  margin-bottom: 8px;
}
.cv-paused-line {
  font-family: var(--body);
  font-size: 13px;
  color: var(--mid);
  font-style: italic;
}
.cv-paused-amount {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid rgba(138,90,30,0.2);
}
.cv-paused-amount-val {
  font-family: var(--display);
  font-size: 26px;
  color: #c8922a;
}
.cv-paused-amount-label {
  font-family: var(--body);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--mid);
  margin-top: 4px;
}

/* ── DESKTOP ENHANCEMENT (client view) ── */
@media (min-width: 720px) {
  .cv-hero { padding: 52px 64px 40px; }
  .cv-timeline { padding: 26px 64px 28px; }
  .cv-cards { grid-template-columns: repeat(3, 1fr); }
  .cv-card { border-bottom: none; border-right: 1px solid var(--rule); }
  .cv-card:last-child { border-right: none; }
  .cv-chart-section { padding: 48px 64px; }
  .cv-split { padding: 40px 64px 48px; }
  .cv-txn-section { padding: 32px 64px 56px; }
  .cv-paused { padding: 28px 64px; display: flex; justify-content: space-between; align-items: center; }
  .cv-paused-amount { margin-top: 0; padding-top: 0; border-top: none; text-align: right; }
  .cv-chart-wrap { height: 300px; }
}

/* ── STAT GRID (legacy — retained, unused by client view) ── */
.stats-section {
  padding: 40px 64px;
  border-bottom: 1px solid var(--rule);
}

.stats-section-label {
  font-family: var(--body);
  font-size: 9px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--mid);
  margin-bottom: 24px;
}

.stat-grid {
  display: grid;
  border: 1px solid var(--rule2);
}

.stat-grid.cols-6 { grid-template-columns: repeat(6, 1fr); }
.stat-grid.cols-5 { grid-template-columns: repeat(5, 1fr); }

.stat-cell {
  padding: 24px 20px;
  border-right: 1px solid var(--rule2);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.stat-cell:last-child { border-right: none; }

.stat-label {
  font-family: var(--body);
  font-size: 9px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--mid);
  line-height: 1.4;
}

.stat-value {
  font-family: var(--display);
  font-size: 22px;
  font-weight: 400;
  color: var(--white);
  letter-spacing: 0.02em;
  line-height: 1.1;
}

.stat-value.gold  { color: var(--gold-lt); }
.stat-value.green { color: #6aaa7a; }
.stat-value.violet { color: #9a7aaa; }
.stat-value.dim   { color: var(--off); font-size: 18px; }

.stat-sub {
  font-family: var(--body);
  font-size: 11px;
  color: var(--mid);
  font-style: italic;
}

/* ── PROGRESS BAR ── */
.progress-pct {
  font-family: var(--display);
  font-size: 22px;
  color: var(--gold-lt);
  letter-spacing: 0.02em;
  line-height: 1.1;
}

.progress-track {
  height: 2px;
  background: var(--dim);
  width: 100%;
  margin: 6px 0;
}

.progress-fill {
  height: 2px;
  background: var(--gold);
  transition: width 1s ease;
}

/* ── CHARTS SECTION ── */
.charts-section {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 1px;
  background: var(--rule);
  border-bottom: 1px solid var(--rule);
}

.chart-panel {
  background: var(--bg);
  padding: 36px 32px;
}

.chart-panel-label {
  font-family: var(--body);
  font-size: 9px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--mid);
  margin-bottom: 6px;
}

.chart-panel-sub {
  font-family: var(--body);
  font-size: 13px;
  color: var(--dim);
  font-style: italic;
  margin-bottom: 28px;
}

.chart-wrap { position: relative; height: 260px; }

.half-donut-wrap {
  position: relative;
  height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.donut-center {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  pointer-events: none;
}

.donut-pct {
  font-family: var(--display);
  font-size: 28px;
  font-weight: 300;
  color: var(--white);
  letter-spacing: 0.02em;
  line-height: 1;
}

.donut-label {
  font-family: var(--body);
  font-size: 9px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--mid);
  margin-top: 6px;
}

.legend {
  display: flex;
  gap: 16px;
  margin-top: 20px;
  justify-content: center;
  flex-wrap: wrap;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--body);
  font-size: 12px;
  color: var(--mid);
  letter-spacing: 0.1em;
}

.legend-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* ── TRANSACTION HISTORY ── */
.txn-section { padding: 48px 64px; }

.txn-section-label {
  font-family: var(--body);
  font-size: 9px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--mid);
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--rule2);
}

.txn-row {
  display: grid;
  grid-template-columns: 120px 1fr 140px;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid var(--rule);
  gap: 24px;
}

.txn-row:last-child { border-bottom: none; }

.txn-date {
  font-family: var(--body);
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--mid);
  text-transform: uppercase;
}

.txn-desc {
  font-family: var(--body);
  font-size: 15px;

<body>

<header>
  <a href="https://www.bayfallmorrigan.com"><img class="logo-img" src="logopng.png" alt="Bayfall Morrigan"></a>
  <button class="hamburger" id="hamburger" onclick="toggleMenu()" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
  <div class="header-right">
    <a href="https://www.bayfallmorrigan.com">Home</a>
    <a class="active">My Account</a>
    <a class="logout-link" id="signOutBtn">Sign Out</a>
  </div>
</header>

<div class="mobile-menu" id="mobile-menu">
  <a href="https://www.bayfallmorrigan.com" onclick="closeMenu()">Home</a>
  <a onclick="closeMenu()">My Account</a>
  <a id="mobileSignOut" onclick="closeMenu()">Sign Out</a>
</div>

<div class="page" id="mainPage">
  <div class="loading-screen" id="loadingScreen">Loading account data...</div>
</div>

<script>
// ── Helpers ──────────────────────────────────────────────
const fmt = n => '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtDate = s => {
  if (!s) return '—';
  const d = new Date(s + 'T12:00:00');
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
};
const daysBetween = (a, b) => Math.round((b - a) / 86400000);
const weeksBetween = (a, b) => Math.max(0, Math.floor(daysBetween(a, b) / 7));

const TT = {
  backgroundColor: '#161512',
  borderColor: '#2a2824',
  borderWidth: 1,
  titleColor: '#7a7670',
  bodyColor: '#f0ede8',
  titleFont: { family: "'EB Garamond', serif", size: 10 },
  bodyFont: { family: "'Cormorant Garamond', serif", size: 14 },
};

// ── Sign out ─────────────────────────────────────────────
document.getElementById('signOutBtn').addEventListener('click', () => {
  auth.signOut().then(() => window.location.href = 'login.html');
});
document.getElementById('mobileSignOut').addEventListener('click', () => {
  auth.signOut().then(() => window.location.href = 'login.html');
});

function toggleMenu() {
  document.getElementById('hamburger').classList.toggle('open');
  document.getElementById('mobile-menu').classList.toggle('open');
}
function closeMenu() {
  document.getElementById('hamburger').classList.remove('open');
  document.getElementById('mobile-menu').classList.remove('open');
}

// ── Auth guard + data load ───────────────────────────────
auth.onAuthStateChanged(user => {
  if (!user) {
    window.location.href = 'login.html';
    return;
  }
  db.ref('clients').orderByChild('uid').equalTo(user.uid).once('value').then(snap => {
    const data = snap.val();
    if (!data) {
      document.getElementById('loadingScreen').textContent = 'Account not found.';
      return;
    }
    buildDashboard(Object.values(data)[0]);
  }).catch(() => {
    document.getElementById('loadingScreen').textContent = 'Error loading account. Please try again.';
  });
});

// ── Build dashboard ──────────────────────────────────────
function buildInactiveDashboard(d, today) {
  const frozenDate    = d.frozenDate ? new Date(d.frozenDate + 'T12:00:00') : null;
  const weeklyDeposit = d.phase1.weeklyDeposit;
  const frozenBalance = d.frozenBalance || d.phase1.finalBalance;
  const frozenYield   = d.frozenYield || d.phase1.buildYieldEarned;
  const totalDeposited = d.totalDepositedActual || d.phase1.totalDeposited;

  const frozenReturnPct = totalDeposited > 0 ? (frozenYield / totalDeposited * 100).toFixed(2) : '0.00';
  const lastDepDate   = d.lastDepositDate ? new Date(d.lastDepositDate + 'T12:00:00') : frozenDate;
  // Outstanding is bounded by the contract: total scheduled deposits minus what
  // was actually deposited. The deposit obligation ends when the contract ends,
  // it does not keep accruing week after week.
  const contractDepositTotal = d.phase1.totalDeposited;
  const amountBehind = (d.missingDepositBalance !== undefined)
    ? d.missingDepositBalance
    : Math.max(0, contractDepositTotal - totalDeposited);
  const weeksMissed  = weeklyDeposit > 0 ? Math.round(amountBehind / weeklyDeposit) : 0;

  const page = document.getElementById('mainPage');
  page.innerHTML = `
    <div class="acct-header">
      <div>
        <div class="acct-eyebrow">Your Account</div>
        <div class="acct-name">${d.clientName.split(' ')[0]} <em>${d.clientName.split(' ').slice(1).join(' ')}</em></div>
        <div class="acct-meta">Started ${fmtDate(d.phase1.startDate)} &nbsp;·&nbsp; Paused</div>
      </div>
      <div class="acct-status">
        <div class="status-badge inactive">Inactive</div>
        <div class="last-updated">As of ${today.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</div>
      </div>
    </div>

    <div class="cv-hero">
      <div class="cv-hero-label">Frozen Balance</div>
      <div class="cv-hero-value">${fmt(frozenBalance)}</div>
      <div class="cv-hero-sub">as of ${fmtDate(d.lastDepositDate || d.frozenDate)}</div>
    </div>

    <div class="cv-paused">
      <div>
        <div class="cv-paused-title">Deposits Paused</div>
        <div class="cv-paused-line">Last deposit received ${fmtDate(d.lastDepositDate)}</div>
        <div class="cv-paused-line">${weeksMissed} weekly deposits missed since</div>
      </div>
      <div class="cv-paused-amount">
        <div class="cv-paused-amount-val">${fmt(amountBehind)}</div>
        <div class="cv-paused-amount-label">Outstanding at ${fmt(weeklyDeposit)} / week</div>
      </div>
    </div>

    <div class="cv-cards">
      <div class="cv-card">
        <div class="cv-card-label">Deposited</div>
        <div class="cv-card-value">${fmt(totalDeposited)}</div>
        <div class="cv-card-sub">while active</div>
      </div>
      <div class="cv-card">
        <div class="cv-card-label">Frozen Balance</div>
        <div class="cv-card-value">${fmt(frozenBalance)}</div>
        <div class="cv-card-sub">deposits + ${fmt(frozenYield)} earned</div>
      </div>
      <div class="cv-card">
        <div class="cv-card-label">Target Balance</div>
        <div class="cv-card-value gold">${fmt(d.phase1.targetBalance)}</div>
        <div class="cv-card-sub">${fmt(Math.max(0, d.phase1.targetBalance - frozenBalance))} remaining</div>
      </div>
    </div>

    <div class="cv-chart-section">
      <div class="cv-chart-title">Your Balance — Through Freeze</div>
      <div class="cv-chart-sub">Deposits and earnings up to the point the account was paused</div>
      <div class="cv-chart-wrap"><canvas id="frozenChart"></canvas></div>
    </div>

    <div class="cv-split">
      <div class="cv-split-title">What Makes Up Your Balance</div>
      <div class="cv-split-bar">
        <div class="cv-split-seg dep"  id="cvSegDep"></div>
        <div class="cv-split-seg earn" id="cvSegEarn"></div>
      </div>
      <div class="cv-split-legend">
        <div class="cv-split-key">
          <div class="cv-split-dot dep"></div>
          <div class="cv-split-ktext">
            <div class="cv-split-kname">Your Deposits</div>
            <div class="cv-split-kval">${fmt(totalDeposited)}</div>
          </div>
        </div>
        <div class="cv-split-key">
          <div class="cv-split-dot earn"></div>
          <div class="cv-split-ktext">
            <div class="cv-split-kname">Earnings (${frozenReturnPct}%)</div>
            <div class="cv-split-kval earn">${fmt(frozenYield)}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="cv-txn-section">
      <button class="cv-txn-toggle" id="cvTxnToggle">
        <span>View Transaction History</span>
        <span class="cv-txn-chevron">▾</span>
      </button>
      <div class="cv-txn-body" id="cvTxnBody">
        <div class="cv-txn-inner"><div id="txnList"></div></div>
      </div>
    </div>

    <footer>
      <div class="footer-mark">Bayfall Morrigan</div>
      <div class="footer-note">This account statement is for informational purposes only.</div>
      <a class="logout-link" id="footerSignOut">Sign Out</a>
    </footer>
  `;

  document.getElementById('footerSignOut').addEventListener('click', () => {
    auth.signOut().then(() => window.location.href = 'login.html');
  });

  requestAnimationFrame(() => {
    const splitTotal = totalDeposited + frozenYield || 1;
    document.getElementById('cvSegDep').style.width  = (totalDeposited / splitTotal * 100) + '%';
    document.getElementById('cvSegEarn').style.width = (frozenYield / splitTotal * 100) + '%';
  });

  const txnToggle = document.getElementById('cvTxnToggle');
  const txnBody   = document.getElementById('cvTxnBody');
  txnToggle.addEventListener('click', () => {
    txnToggle.classList.toggle('open');
    txnBody.classList.toggle('open');
  });

  renderTransactions(d.transactions);
  renderInactiveCharts(d, frozenDate, frozenBalance, frozenYield, totalDeposited);

  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('pageContent') && (document.getElementById('pageContent').style.display = 'block');
}

// ── Inactive-account charts ──────────────────────────────
function renderInactiveCharts(d, frozenDate, frozenBalance, frozenYield, totalDeposited) {
  const wcd = d.weeklyChartData;
  if (!wcd || !wcd.labels || !wcd.labels.length) return; // no build-up chart data on this record

  const p1StartDate = new Date(d.phase1.startDate + 'T12:00:00');
  const freezeRef    = frozenDate || p1StartDate;
  const freezeIdxRaw = weeksBetween(p1StartDate, freezeRef);
  const freezeIdx    = Math.max(0, Math.min(freezeIdxRaw, wcd.labels.length - 1));

  const weekStr = i => {
    const wd = new Date(p1StartDate);
    wd.setDate(wd.getDate() + Math.max(0, i - 1) * 7);
    return wd.toISOString().split('T')[0];
  };

  // Where "today" falls on the week axis (deposits at week i are dated start+(i-1)*7,
  // so today's step lands at weeksBetween+1). Clamped to the chart's last week.
  const todayIdx = Math.max(0, Math.min(weeksBetween(p1StartDate, new Date()) + 1, wcd.labels.length - 1));

  // Classify yield vs deposit by type (case-insensitive) OR description. Some yield entries
  // ("Monthly yield compounded", and the manual "Yield" correction) are logged as
  // 'credit'/'Yield', so the description check is a fallback so they aren't read as deposits.
  const isYieldTxn = t =>
    String(t.type).toLowerCase() === 'yield' || (t.description && /yield/i.test(t.description));

  const allTxns = d.transactions ? Object.values(d.transactions) : [];
  const depositTxns = allTxns.filter(t => !isYieldTxn(t) && String(t.type).toLowerCase() === 'credit');
  const yieldTxns   = allTxns.filter(isYieldTxn);

  // Both lines are TRUE running totals straight off the ledger — no stored-field + delta
  // math, so nothing is ever double-counted and the curves always sum to the real deposited
  // ($750) and yield ($275.92) figures. A late correction simply steps up on its dated week.
  const cumTo = (txns, cutoff) =>
    txns.filter(t => t.date <= cutoff).reduce((s, t) => s + (Number(t.amount) || 0), 0);
  const depSeries   = wcd.labels.map((_, i) => i === 0 ? 0 : cumTo(depositTxns, weekStr(i)));
  const yieldSeries = wcd.labels.map((_, i) => i === 0 ? 0 : cumTo(yieldTxns,   weekStr(i)));

  const targetSeries = wcd.labels.map(() => d.phase1.targetBalance);
  const pointStyle = wcd.labels.map((_, i) => i === freezeIdx ? 'circle' : false);
  const pointRadius = wcd.labels.map((_, i) => i === freezeIdx ? 5 : 0);

  // "Today" vertical marker drawn over the plot.
  const todayMarker = {
    id: 'todayMarker',
    afterDatasetsDraw(chart) {
      const xs = chart.scales.x;
      if (!xs) return;
      const x = xs.getPixelForValue(todayIdx);
      const { top, bottom } = chart.chartArea;
      const ctx = chart.ctx;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(x, top);
      ctx.lineTo(x, bottom);
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 3]);
      ctx.strokeStyle = 'rgba(240,237,232,0.5)';
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = "10px 'EB Garamond', serif";
      ctx.fillStyle = '#f0ede8';
      ctx.textBaseline = 'top';
      ctx.textAlign = x > chart.chartArea.right - 28 ? 'right' : 'left';
      ctx.fillText('TODAY', ctx.textAlign === 'right' ? x - 3 : x + 3, top + 2);
      ctx.restore();
    }
  };

  const chartCtx = document.getElementById('frozenChart').getContext('2d');
  new Chart(chartCtx, {
    type: 'line',
    plugins: [todayMarker],
    data: {
      labels: wcd.labels,
      datasets: [
        {
          label: 'Balance',
          data: wcd.labels.map((_, i) => (depSeries[i] || 0) + (yieldSeries[i] || 0)),
          fill: true,
          backgroundColor: 'rgba(184,146,42,0.10)',
          borderColor: '#b8922a',
          borderWidth: 2,
          pointRadius, pointStyle,
          pointBackgroundColor: '#f0ede8', pointBorderColor: '#b8922a', pointBorderWidth: 2,
          tension: 0.3
        },
        { label: 'Target', data: targetSeries, fill: false, borderColor: 'rgba(255,255,255,0.12)', borderWidth: 1, borderDash: [5,4], pointRadius: 0, tension: 0 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: { ...TT, callbacks: {
          title: ctx => ctx[0].dataIndex === freezeIdx ? `${ctx[0].label} — Frozen` : ctx[0].label,
          label: ctx => ctx.dataset.label === 'Target' ? null : ` Balance: $${(ctx.raw||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`
        } }
      },
      scales: {
        x: { grid: { display: false }, ticks: { color: '#5a5650', font: { family:"'EB Garamond',serif", size:10 }, maxTicksLimit: 7, maxRotation: 0 }, border: { color: '#1e1c18' } },
        y: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#5a5650', font: { family:"'EB Garamond',serif", size:10 }, callback: v => '$'+v.toLocaleString() }, border: { color: '#1e1c18' } }
      }
    }
  });
}

function buildDashboard(d) {
  const today       = new Date();
  const p1Start     = new Date(d.phase1.startDate + 'T12:00:00');
  const p1MatDate   = new Date(d.phase1.phase1MaturityDate + 'T12:00:00');
  const p2MatDate   = new Date(d.phase2.lockMaturityDate + 'T12:00:00');

  const weeksElapsed = Math.min(weeksBetween(p1Start, today) + 1, d.phase1.weeksToTarget);
  const isInactive   = d.status === 'inactive';

  // Handle inactive accounts separately
  if (isInactive) {
    buildInactiveDashboard(d, today);
    return;
  }

  const inPhase1     = today < p1MatDate;
  const inPhase2     = !inPhase1 && today < p2MatDate;
  const complete     = today >= p2MatDate;

  // ── Calculate live values ──
  const p1Weeks      = d.phase1.weeksToTarget;
  const p1Progress   = inPhase1 ? Math.min(weeksElapsed / p1Weeks * 100, 100) : 100;

  // Deposits so far — sum only "Weekly contribution" transactions up to today
  const depositsToDate = (() => {
    if (!inPhase1) return d.phase1.totalDeposited;
    if (!d.transactions) return 0;
    const todayStr = today.toISOString().split('T')[0];
    return Object.values(d.transactions)
      .filter(t => t.type === 'credit' && t.date <= todayStr && t.description && t.description.startsWith('Weekly contribution'))
      .reduce((sum, t) => sum + (Number(t.amount) || 0), 0);
  })();

  // Rebuild deposited array week-by-week from actual transactions (so manual Firebase edits reflect in chart)
  const dynamicDep = (() => {
    if (!d.weeklyChartData) return [];
    const txnCredits = d.transactions
      ? Object.values(d.transactions).filter(
          t => t.type === 'credit' && t.description && t.description.startsWith('Weekly contribution')
        )
      : [];
    const p1StartDate = new Date(d.phase1.startDate + 'T12:00:00');
    return d.weeklyChartData.labels.map((_, i) => {
      if (i === 0) return 0; // "Start" — no deposits yet
      const weekDate = new Date(p1StartDate);
      weekDate.setDate(weekDate.getDate() + (i - 1) * 7);
      const weekStr = weekDate.toISOString().split('T')[0];
      return txnCredits
        .filter(t => t.date <= weekStr)
        .reduce((sum, t) => sum + (Number(t.amount) || 0), 0);
    });
  })();

  // Yield to date in phase 1 — interpolate from chart data
  let yieldToDate = 0;
  if (d.weeklyChartData && d.weeklyChartData.yieldLayer) {
    const yl = d.weeklyChartData.yieldLayer;
    const idx = Math.min(weeksElapsed, yl.length - 1);
    yieldToDate = yl[idx] || 0;
  }

  const currentBalance = inPhase1
    ? depositsToDate + yieldToDate
    : d.phase1.finalBalance;

  // Phase 2 lock yield — sum posted lock-yield transactions (date <= today), same as the ledger.
  // Lock-yield entries are yield transactions dated on/after the lock start; phase-1 build yields fall before it.
  let p2YieldToDate = 0;
  let p2Balance = d.phase1.finalBalance;
  if (!inPhase1) {
    const todayStr     = today.toISOString().split('T')[0];
    const lockStartStr = d.phase2.lockStartDate;
    const txns = d.transactions ? Object.values(d.transactions) : [];
    const isYieldTxn = t =>
      String(t.type).toLowerCase() === 'yield' || (t.description && /yield/i.test(t.description));
    p2YieldToDate = txns
      .filter(t => t.date >= lockStartStr && t.date <= todayStr && isYieldTxn(t))
      .reduce((sum, t) => {
        const amt = Math.abs(Number(t.amount) || 0);
        return sum + (String(t.type).toLowerCase() === 'debit' ? -amt : amt);
      }, 0);
    p2YieldToDate = Math.round(p2YieldToDate * 100) / 100;
    p2Balance = d.phase1.finalBalance + p2YieldToDate;
  }

  // Phase 2 progress
  const p2TotalDays   = daysBetween(new Date(d.phase2.lockStartDate + 'T12:00:00'), p2MatDate);
  const p2DaysElapsed = inPhase2 ? daysBetween(new Date(d.phase2.lockStartDate + 'T12:00:00'), today) : p2TotalDays;
  const p2Progress    = Math.min(p2DaysElapsed / p2TotalDays * 100, 100);

  // Days/months remaining
  const daysToP1 = Math.max(0, daysBetween(today, p1MatDate));
  const daysToP2 = Math.max(0, daysBetween(today, p2MatDate));

  // Return on deposit
  const totalInvested = d.phase1.totalDeposited;
  const currentReturn = inPhase1
    ? (depositsToDate > 0 ? yieldToDate / depositsToDate * 100 : 0)
    : ((p2YieldToDate + d.phase1.buildYieldEarned) / totalInvested * 100);

  // ── Status badge ──
  const statusText  = complete ? 'Complete' : inPhase1 ? 'Phase I — Active' : 'Phase II — Active';
  const statusClass = inPhase2 ? 'status-badge phase2' : 'status-badge';

  // ── Phase tabs ──
  const p1TabClass = inPhase1 ? 'phase-tab active' : 'phase-tab complete';
  const p2TabClass = complete ? 'phase-tab complete' : inPhase2 ? 'phase-tab phase2-active' : 'phase-tab';

  // ══ Display-scoped values (no new math — derived from figures above) ══
  // Timeline runs across the WHOLE program: Phase 1 start → Phase 2 maturity.
  const progStart = p1Start;
  const progEnd   = p2MatDate;
  const progTotal = Math.max(1, daysBetween(progStart, progEnd));
  const progDone  = Math.min(progTotal, Math.max(0, daysBetween(progStart, today)));
  const overallPct = complete ? 100 : Math.min(100, progDone / progTotal * 100);
  const daysLeftOverall = Math.max(0, daysBetween(today, progEnd));
  const monthsLeftOverall = (daysLeftOverall / 30.44).toFixed(1);

  // Three headline cards + the deposits-vs-earnings split.
  const depForSplit  = inPhase1 ? depositsToDate : d.phase1.totalDeposited;
  const earnForSplit = inPhase1 ? yieldToDate : (d.phase1.buildYieldEarned + p2YieldToDate);
  const balNow       = inPhase1 ? currentBalance : p2Balance;
  const projectedPayout = d.phase2.lockFinalBalance;
  const returnNow    = depForSplit > 0 ? (earnForSplit / depForSplit * 100) : 0;

  const heroSub = complete
    ? `Your contract has matured. Final payout <strong>${fmt(projectedPayout)}</strong>.`
    : `On track for <strong>${fmt(projectedPayout)}</strong> at maturity`;

  const phaseWord = complete ? 'Complete' : inPhase1 ? 'Building' : 'Locked & growing';

  // ── Build HTML ──
  const page = document.getElementById('mainPage');
  page.innerHTML = `
    <div class="acct-header">
      <div>
        <div class="acct-eyebrow">Your Account</div>
        <div class="acct-name">${d.clientName.split(' ')[0]} <em>${d.clientName.split(' ').slice(1).join(' ')}</em></div>
        <div class="acct-meta">Started ${fmtDate(d.phase1.startDate)} &nbsp;·&nbsp; ${phaseWord}</div>
      </div>
      <div class="acct-status">
        <div class="${statusClass}">${statusText}</div>
        <div class="last-updated">As of ${today.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</div>
      </div>
    </div>

    <div class="cv-hero">
      <div class="cv-hero-label">Current Balance</div>
      <div class="cv-hero-value">${fmt(balNow)}</div>
      <div class="cv-hero-sub">${heroSub}</div>
    </div>

    <div class="cv-timeline">
      <div class="cv-timeline-head">
        <div class="cv-timeline-title">Contract Progress</div>
        <div class="cv-timeline-remain">${complete ? 'Matured' : monthsLeftOverall + ' months to go'}</div>
      </div>
      <div class="cv-track-wrap">
        <div class="cv-track ${inPhase1 ? '' : 'phase2'}">
          <div class="cv-track-fill" id="cvFill"></div>
          <div class="cv-marker" id="cvMarker"></div>
        </div>
        <div class="cv-marker-flag" id="cvFlag">${overallPct.toFixed(0)}% · Today</div>
      </div>
      <div class="cv-endpoints">
        <div class="cv-endpoint">
          <div class="cv-endpoint-label">Start</div>
          <div class="cv-endpoint-date">${fmtDate(d.phase1.startDate)}</div>
        </div>
        <div class="cv-endpoint right">
          <div class="cv-endpoint-label">Maturity</div>
          <div class="cv-endpoint-date">${fmtDate(d.phase2.lockMaturityDate)}</div>
        </div>
      </div>
    </div>

    <div class="cv-cards">
      <div class="cv-card">
        <div class="cv-card-label">Deposited</div>
        <div class="cv-card-value">${fmt(depForSplit)}</div>
        <div class="cv-card-sub">${inPhase1 ? fmt(d.phase1.weeklyDeposit) + ' / week' : 'contributions complete'}</div>
      </div>
      <div class="cv-card">
        <div class="cv-card-label">Current Balance</div>
        <div class="cv-card-value">${fmt(balNow)}</div>
        <div class="cv-card-sub">deposits + ${fmt(earnForSplit)} earned</div>
      </div>
      <div class="cv-card">
        <div class="cv-card-label">Projected Payout</div>
        <div class="cv-card-value green">${fmt(projectedPayout)}</div>
        <div class="cv-card-sub">at ${fmtDate(d.phase2.lockMaturityDate)}</div>
      </div>
    </div>

    <div class="cv-chart-section">
      <div class="cv-chart-title">Your Balance Over Time</div>
      <div class="cv-chart-sub">Where you started, where you are now, and where you're headed</div>
      <div class="cv-chart-wrap"><canvas id="growthChart"></canvas></div>
    </div>

    <div class="cv-split">
      <div class="cv-split-title">What Makes Up Your Balance</div>
      <div class="cv-split-bar">
        <div class="cv-split-seg dep"  id="cvSegDep"></div>
        <div class="cv-split-seg earn" id="cvSegEarn"></div>
      </div>
      <div class="cv-split-legend">
        <div class="cv-split-key">
          <div class="cv-split-dot dep"></div>
          <div class="cv-split-ktext">
            <div class="cv-split-kname">Your Deposits</div>
            <div class="cv-split-kval">${fmt(depForSplit)}</div>
          </div>
        </div>
        <div class="cv-split-key">
          <div class="cv-split-dot earn"></div>
          <div class="cv-split-ktext">
            <div class="cv-split-kname">Earnings (${returnNow.toFixed(1)}%)</div>
            <div class="cv-split-kval earn">${fmt(earnForSplit)}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="cv-txn-section">
      <button class="cv-txn-toggle" id="cvTxnToggle">
        <span>View Transaction History</span>
        <span class="cv-txn-chevron">▾</span>
      </button>
      <div class="cv-txn-body" id="cvTxnBody">
        <div class="cv-txn-inner"><div id="txnList"></div></div>
      </div>
    </div>

    <footer>
      <div class="footer-mark">Bayfall Morrigan</div>
      <div class="footer-note">This account statement is for informational purposes only.</div>
      <a class="logout-link" id="footerSignOut">Sign Out</a>
    </footer>
  `;

  document.getElementById('footerSignOut').addEventListener('click', () => {
    auth.signOut().then(() => window.location.href = 'login.html');
  });

  // ── Animate timeline + split (after paint) ──
  requestAnimationFrame(() => {
    document.getElementById('cvFill').style.width   = overallPct + '%';
    document.getElementById('cvMarker').style.left  = overallPct + '%';
    // Flag is center-anchored; clamp so its text stays inside the track on any width.
    const flagPct = Math.min(90, Math.max(10, overallPct));
    document.getElementById('cvFlag').style.left    = flagPct + '%';
    const splitTotal = depForSplit + earnForSplit || 1;
    document.getElementById('cvSegDep').style.width  = (depForSplit / splitTotal * 100) + '%';
    document.getElementById('cvSegEarn').style.width = (earnForSplit / splitTotal * 100) + '%';
  });

  // ── Collapsible transactions ──
  const txnToggle = document.getElementById('cvTxnToggle');
  const txnBody   = document.getElementById('cvTxnBody');
  txnToggle.addEventListener('click', () => {
    txnToggle.classList.toggle('open');
    txnBody.classList.toggle('open');
  });

  // ── Render single growth chart ──
  renderGrowthChart(d, inPhase1, dynamicDep, weeksElapsed, today, progEnd);

  // ── Render transactions ──
  renderTransactions(d.transactions);
}

// ── Single growth curve: full contract, one line, "you are here" + projection ──
function renderGrowthChart(d, inPhase1, dynamicDep, weeksElapsed, today, progEnd) {
  const ctx = document.getElementById('growthChart').getContext('2d');

  // Build one balance series across the whole contract from the SAME source
  // arrays the old charts used — Phase 1 weekly (deposits+build yield), then
  // Phase 2 monthly (deposits + build + lock). No values are recomputed.
  const p1Labels = d.weeklyChartData.labels;
  const p1Dep    = dynamicDep;
  const p1Build  = d.weeklyChartData.yieldLayer;
  const p1Bal    = p1Labels.map((_, i) => (p1Dep[i] || 0) + (p1Build[i] || 0));

  // Phase 2 monthly totals (skip index 0 — duplicates P1 final)
  const p2Labels = d.barChartData.labels.slice(1);
  const p2Dep    = d.barChartData.depLayer.slice(1);
  const p2Build  = d.barChartData.buildLayer.slice(1);
  const p2Lock   = d.barChartData.lockLayer.slice(1);
  const p2Bal    = p2Labels.map((_, i) => (p2Dep[i] || 0) + (p2Build[i] || 0) + (p2Lock[i] || 0));

  const labels = [...p1Labels, ...p2Labels];
  const balAll = [...p1Bal, ...p2Bal];

  // "You are here" index: last point at or before today.
  // Phase 1 → weeksElapsed; Phase 2 → p1 length + months since lock start.
  let hereIdx;
  if (inPhase1) {
    hereIdx = Math.min(weeksElapsed, p1Labels.length - 1);
  } else {
    const lockStart = new Date(d.phase2.lockStartDate + 'T12:00:00');
    const monthsIn = Math.max(0, Math.floor(daysBetween(lockStart, today) / 30.44));
    hereIdx = Math.min(p1Labels.length - 1 + monthsIn, labels.length - 1);
  }

  // Split the line: solid up to "here", dashed (projection) after.
  const solid    = balAll.map((v, i) => i <= hereIdx ? v : null);
  const projected = balAll.map((v, i) => i >= hereIdx ? v : null);

  const pointR = balAll.map((_, i) => i === hereIdx ? 5 : 0);

  new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: 'Balance', data: solid,
          borderColor: '#b8922a', borderWidth: 2,
          backgroundColor: 'rgba(184,146,42,0.10)', fill: true,
          tension: 0.35, spanGaps: false,
          pointRadius: pointR, pointBackgroundColor: '#f0ede8', pointBorderColor: '#b8922a', pointBorderWidth: 2
        },
        {
          label: 'Projected', data: projected,
          borderColor: 'rgba(154,122,170,0.7)', borderWidth: 2, borderDash: [5,4],
          backgroundColor: 'rgba(122,90,138,0.06)', fill: true,
          tension: 0.35, pointRadius: 0, spanGaps: false
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: { ...TT, callbacks: {
          title: items => items[0].dataIndex === hereIdx ? items[0].label + ' — Today' : items[0].label,
          label: ctx => ctx.raw == null ? null : ' Balance: $' + Number(ctx.raw).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})
        } }
      },
      scales: {
        x: { grid: { display: false }, ticks: { color: '#5a5650', font: { family:"'EB Garamond',serif", size:10 }, maxTicksLimit: 7, maxRotation: 0 }, border: { color: '#1e1c18' } },
        y: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#5a5650', font: { family:"'EB Garamond',serif", size:10 }, callback: v => '$'+v.toLocaleString() }, border: { color: '#1e1c18' } }
      }
    }
  });
}

// ── Transactions ─────────────────────────────────────────
function renderTransactions(txns) {
  const el = document.getElementById('txnList');
  if (!txns || Object.keys(txns).length === 0) {
    el.innerHTML = '<div class="txn-empty">No transactions recorded yet.</div>';
    return;
  }

  const now = new Date();
  const todayStr = now.toISOString().split('T')[0];
  const list = Object.values(txns)
    .filter(t => t.date <= todayStr)
    .sort((a, b) => new Date(b.date) - new Date(a.date));
  el.innerHTML = list.map(t => `
    <div class="txn-row">
      <div class="txn-date">${fmtDate(t.date)}</div>
      <div class="txn-desc">${t.description}</div>
      <div class="txn-amt ${String(t.type).toLowerCase() === 'debit' ? 'debit' : 'credit'}">${String(t.type).toLowerCase() === 'debit' ? '− ' : '+ '}$${Math.abs(t.amount).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
    </div>
  `).join('');
}
</script>
