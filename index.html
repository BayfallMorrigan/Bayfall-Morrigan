<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bayfall Morrigan</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<meta name="robots" content="noindex, nofollow">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --black:   #080808;
  --white:   #f0ede8;
  --mid:     #7a7670;
  --dim:     #3a3830;
  --rule:    #1a1a1a;
  --rule2:   #2a2824;
  --rule3:   #3a3830;
  --display: 'Cormorant Garamond', Georgia, serif;
  --body:    'EB Garamond', Georgia, serif;
}

html, body {
  background: var(--black);
  color: var(--white);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.8;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* PAGE */
.page {
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 24px 80px;
  overflow: hidden;
}

.page-bg {
  position: absolute;
  inset: 0;
  background-image: url('Curves2.png');
  background-size: cover;
  background-position: center;
  z-index: 0;
  opacity: 0.5;
}

.page-bg::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(
    ellipse at center,
    rgba(8,8,8,0.55) 0%,
    rgba(8,8,8,0.88) 65%,
    rgba(8,8,8,0.99) 100%
  );
}

/* HOLDING WRAP */
.holding-wrap {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 560px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  opacity: 0;
  animation: fadeIn 1.4s ease 0.2s forwards;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* LOGO */
.holding-logo {
  width: 280px;
  height: auto;
  display: block;
  filter: invert(1) brightness(0.78);
  margin-bottom: 56px;
}

/* DOUBLE RULE */
.holding-divider {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  margin: 0 auto 40px;
}

.holding-divider .rule-thin {
  width: 60px;
  height: 1px;
  background: var(--rule3);
}

.holding-divider .rule-dot {
  width: 3px;
  height: 3px;
  background: var(--rule3);
  border-radius: 50%;
}

/* DESCRIPTOR */
.holding-descriptor {
  font-family: var(--display);
  font-size: 20px;
  color: rgba(240,237,232,0.6);
  font-style: italic;
  font-weight: 300;
  letter-spacing: 0.02em;
  line-height: 1.5;
  margin-bottom: 64px;
  max-width: 440px;
}

/* CONTACT */
.contact-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin-bottom: 72px;
}

.contact-label {
  font-family: var(--body);
  font-size: 9px;
  letter-spacing: 0.36em;
  text-transform: uppercase;
  color: var(--mid);
}

.contact-value {
  font-family: var(--display);
  font-size: 18px;
  color: rgba(240,237,232,0.85);
  letter-spacing: 0.015em;
}

.contact-value a {
  color: rgba(240,237,232,0.85);
  text-decoration: none;
  border-bottom: 1px solid var(--rule2);
  padding-bottom: 3px;
  transition: border-color 0.3s, color 0.3s;
}

.contact-value a:hover {
  border-color: var(--dim);
  color: var(--white);
}

/* BUTTON GROUP */
.btn-group {
  display: flex;
  flex-direction: column;
  gap: 16px;
  align-items: center;
}

/* LENDER ACCESS BUTTON */
.access-btn {
  display: inline-block;
  background: transparent;
  border: 1px solid var(--rule3);
  padding: 15px 44px;
  font-family: var(--display);
  font-size: 11px;
  letter-spacing: 0.42em;
  text-transform: uppercase;
  color: rgba(240,237,232,0.6);
  text-decoration: none;
  cursor: pointer;
  transition: all 0.3s;
}

.access-btn:hover {
  border-color: var(--mid);
  color: var(--white);
  background: rgba(240,237,232,0.02);
}

/* FOOTER */
.holding-footer {
  position: absolute;
  bottom: 32px;
  left: 0; right: 0;
  text-align: center;
  z-index: 1;
  font-family: var(--body);
  font-size: 9px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: rgba(240,237,232,0.18);
}

/* MOBILE */
@media (max-width: 600px) {
  .page { padding: 60px 22px 80px; }
  .holding-logo { width: 220px; margin-bottom: 44px; }
  .holding-divider { margin-bottom: 32px; }
  .holding-descriptor { font-size: 17px; margin-bottom: 52px; }
  .contact-block { margin-bottom: 56px; }
  .contact-value { font-size: 16px; }
  .access-btn { padding: 13px 36px; letter-spacing: 0.34em; }
}
</style>
</head>
<body>

<div class="page">
  <div class="page-bg"></div>

  <div class="holding-wrap">
    <img src="logopng.png" alt="Bayfall Morrigan" class="holding-logo">

    <div class="holding-divider">
      <div class="rule-thin"></div>
      <div class="rule-dot"></div>
      <div class="rule-thin"></div>
    </div>

    <p class="holding-descriptor">Private quantitative trading firm engaging in proprietary capital management. Established in 2024</p>

    <div class="contact-block">
      <div class="contact-label">Inquiries</div>
      <div class="contact-value">
        <a href="mailto:contact@bayfallmorrigan.com">contact@bayfallmorrigan.com</a>
      </div>
    </div>

    <div class="btn-group">
      <a class="access-btn" href="login.html">Lender Access</a>
      <a class="access-btn" href="meetthefounder.html">Founder</a>
    </div>
  </div>

  <div class="holding-footer">© 2026 Bayfall Morrigan</div>
</div>

</body>
</html>
